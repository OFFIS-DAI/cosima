[project]
name = "cosima"
version = "0.4.0"
description = "COmmunication SIMulation with Agents"
readme = "README.md"
authors = [{ name = "Cosima Team", email = "emilie.frost@offis.de" }]
requires-python = ">=3.8"
dependencies = [
    "arrow==1.2.3",
    "json-tricks==3.16.1",
    "matplotlib==3.6.2",
    "mosaik==3.1.0",
    "mosaik_api==3.0.3",
    "mosaik-householdsim==2.1.0",
    "numpy>1.24.0",
    "pandas==1.5.2",
    "protobuf==3.13.0",
    "psutil==5.9.4",
    "pytest==7.2.0",
    "pytest_check==1.3.0",
    "setuptools==65.6.3",
    "simpy==3.0.13",
    "termcolor==2.1.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
]

[project.urls]
Repository = "https://gitlab.com/mosaik/examples/cosima.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.protobuf]
dependencies = ["hatch-protobuf"]
proto_paths = ["../protobuf"]
output_path = "src/cosima/messages"
